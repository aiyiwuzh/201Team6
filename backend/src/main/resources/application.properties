server.port=8080
spring.application.name=toptrait-backend

# Enable CORS
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# -------------------------
# SUPABASE CONNECTION (SESSION POOLER)
# -------------------------
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&preparedStatementCacheQueries=0
spring.datasource.username=postgres.pwbbdilghlmkvszoaxpe
spring.datasource.password=CSCI201MoJiang
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------
# HIKARI CONNECTION POOL FIX FOR SUPABASE
# -------------------------
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

# -------------------------
# JPA / HIBERNATE
# -------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false


# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


